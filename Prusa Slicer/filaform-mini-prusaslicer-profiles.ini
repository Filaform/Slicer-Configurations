# Filaform filament profiles for PrusaSlicer: Original Prusa MINI, MINI+ Input Shaper
# For PrusaSlicer 2.9.x. Import with File > Import > Import Config Bundle.
# filaform.com.au

[filament:Filaform Tough PLA+ V3 @MINIIS]
bed_temperature = 60
bridge_fan_speed = 100
compatible_printers = 
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes=~/.*MINIIS.*/ 
cooling = 1
disable_fan_first_layers = 1
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 0.98
fan_always_on = 1
fan_below_layer_time = 100
filament_colour = #FF8000
filament_cooling_final_speed = 3.4
filament_cooling_initial_speed = 2.2
filament_cooling_moves = 4
filament_cost = 29.95
filament_density = 1.26
filament_diameter = 1.75
filament_load_time = 0
filament_loading_speed = 28
filament_loading_speed_start = 3
filament_max_volumetric_speed = 8
filament_minimal_purge_on_wipe_tower = 15
filament_notes = "Filaform Tough PLA+ V3. Nozzle temperature, flow, density and volumetric limit from Filaform. Bed (60 C minimum, for Filaform Adhesive Spray), cooling, chamber and pressure advance from Prusa's Generic PLA @MINIIS.\nfilaform.com.au"
filament_ramming_parameters = "120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6"
filament_settings_id = "Filaform Tough PLA+ V3 @MINIIS"
filament_soluble = 0
filament_toolchange_delay = 0
filament_type = PLA
filament_unload_time = 0
filament_unloading_speed = 90
filament_unloading_speed_start = 100
filament_vendor = Filaform
first_layer_bed_temperature = 60
first_layer_temperature = 220
full_fan_speed_layer = 4
inherits = Generic PLA @MINIIS
max_fan_speed = 100
min_fan_speed = 100
min_print_speed = 15
slowdown_below_layer_time = 12
start_filament_gcode = "M572 S{if nozzle_diameter[0]==0.6}0.17{elsif nozzle_diameter[0]==0.8}0.12{elsif nozzle_diameter[0]==0.4}0.27{elsif nozzle_diameter[0]==0.25}0.85{else}0{endif}"
temperature = 220

