# Filaform filament profiles for PrusaSlicer: Original Prusa MK4S, MK3.9S
# For PrusaSlicer 2.9.x. Import with File > Import > Import Config Bundle.
# filaform.com.au

[filament:Filaform Tough PLA+ V3 @MK4S]
bed_temperature = 60
bridge_fan_speed = 100
compatible_printers = 
compatible_printers_condition = printer_model=~/(MK4S|MK4SMMU3|MK3.9S|MK3.9SMMU3)/ and nozzle_diameter[0]!=0.8 and nozzle_diameter[0]!=0.6 and ! nozzle_high_flow[0]
cooling = 1
cooling_perimeter_transition_distance = 10
cooling_slowdown_logic = consistent_surface
disable_fan_first_layers = 1
enable_dynamic_fan_speeds = 1
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 0.98
fan_always_on = 1
fan_below_layer_time = 17
filament_colour = #FF8000
filament_cooling_final_speed = 3.5
filament_cooling_initial_speed = 10
filament_cooling_moves = 2
filament_cost = 29.95
filament_density = 1.26
filament_diameter = 1.75
filament_infill_max_crossing_speed = 0
filament_infill_max_speed = 0
filament_load_time = 10.5
filament_loading_speed = 10
filament_loading_speed_start = 50
filament_max_volumetric_speed = 8
filament_minimal_purge_on_wipe_tower = 15
filament_notes = "Filaform Tough PLA+ V3. Nozzle temperature, flow, density and volumetric limit from Filaform. Bed (60 C minimum, for Filaform Adhesive Spray), cooling, chamber and pressure advance from Prusa's Generic PLA @MK4S.\nfilaform.com.au"
filament_purge_multiplier = 81.25%
filament_ramming_parameters = "250 100 40.1613 40.3548 40.4516 40.3548 40.2581| 0.05 40.1483 0.45 40.3419 0.95 40.3419 1.45 40.3419 1.95 40.3419 2.45 40.3419 2.95 40.3419 3.45 40.3419 3.95 40.3419 4.45 40.3419 4.95 40.3419"
filament_settings_id = "Filaform Tough PLA+ V3 @MK4S"
filament_soluble = 0
filament_stamping_distance = 45
filament_stamping_loading_speed = 29
filament_toolchange_delay = 0
filament_travel_max_lift = 0.6
filament_travel_ramping_lift = 1
filament_travel_slope = 1
filament_type = PLA
filament_unload_time = 8.5
filament_unloading_speed = 40
filament_unloading_speed_start = 30
filament_vendor = Filaform
first_layer_bed_temperature = 60
first_layer_temperature = 220
full_fan_speed_layer = 3
idle_temperature = 70
inherits = Generic PLA @MK4S
max_fan_speed = 100
min_fan_speed = 70
min_print_speed = 20
overhang_fan_speed_0 = 100
overhang_fan_speed_1 = 100
overhang_fan_speed_2 = 0
overhang_fan_speed_3 = 0
slowdown_below_layer_time = 6
start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.4}0.03{elsif nozzle_diameter[filament_extruder_id]==0.5}0.022{elsif nozzle_diameter[filament_extruder_id]==0.6}0.019{elsif nozzle_diameter[filament_extruder_id]==0.8}0.013{elsif nozzle_diameter[filament_extruder_id]==0.25}0.1{elsif nozzle_diameter[filament_extruder_id]==0.3}0.07{else}0{endif} ; Filament gcode\n\nM142 S36 ; set heatbreak target temp"
temperature = 220

